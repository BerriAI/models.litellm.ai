# Rebuilds models.litellm.ai when LiteLLM's price file changes, so a new model
# usually gets its page within 10 to 20 minutes of landing in BerriAI/litellm,
# then tells search engines which pages changed.
#
# Needs a repo secret VERCEL_DEPLOY_HOOK_URL (Vercel project > Settings > Git >
# Deploy Hooks, branch main). Without it the job only reports whether the live
# site is behind the price file.
name: Refresh model pages

on:
  schedule:
    # GitHub may start scheduled runs a few minutes late; checking often keeps
    # the delay short. A run with no price change takes a few seconds.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      submit_all:
        description: "Submit every URL in the sitemaps to IndexNow, not just changed pages (use after launches or URL changes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-model-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployed: ${{ steps.wait.outcome == 'success' }}
    env:
      SITE: https://models.litellm.ai
      PRICE_FILE: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
      GH_TOKEN: ${{ github.token }}
      DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      # Public by design: search engines verify it at $SITE/<key>.txt
      INDEXNOW_KEY: 2e02f0e5791852cef4f32950cea58c1d
    steps:
      - name: Define the IndexNow helper
        run: |
          # The deploy is what matters; an IndexNow rejection is reported as a
          # warning with IndexNow's own explanation instead of failing the run.
          cat > "$RUNNER_TEMP/indexnow.sh" <<'SH'
          submit_indexnow() {
            status=$(curl -sS -o indexnow-response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json)
            count=$(jq '.urlList | length' indexnow.json)
            case "$status" in
              200|202) echo "IndexNow accepted $count URLs (HTTP $status)." ;;
              *) echo "::warning::IndexNow rejected $count URLs with HTTP $status: $(head -c 500 indexnow-response.txt)" ;;
            esac
          }
          SH
          echo "BASH_ENV=$RUNNER_TEMP/indexnow.sh" >> "$GITHUB_ENV"

      - name: Compare the live build with the price file and benchmark refresh age
        id: check
        run: |
          # raw.githubusercontent.com serves main from a cache for up to five minutes,
          # which can hide a change that just landed. Read the file at its latest
          # commit instead, falling back to main if the API call fails.
          commit=$(gh api 'repos/BerriAI/litellm/commits?path=model_prices_and_context_window.json&per_page=1' --jq '.[0].sha' || true)
          url="$PRICE_FILE"
          if [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then url="https://raw.githubusercontent.com/BerriAI/litellm/$commit/model_prices_and_context_window.json"; fi
          echo "Reading the price file at ${commit:-main}."
          latest=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          build_info=$(curl -fsSL "$SITE/build-info.json" || echo '{}')
          live=$(echo "$build_info" | jq -r '.costMapHash // empty')
          built_at=$(echo "$build_info" | jq -r '.builtAt // empty')
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"
          benchmarks_due=false
          built_epoch=$(date -d "$built_at" +%s 2>/dev/null || echo 0)
          if [ "$(( $(date +%s) - built_epoch ))" -ge 86400 ]; then benchmarks_due=true; fi
          echo "benchmarks_due=$benchmarks_due" >> "$GITHUB_OUTPUT"
          dates_due=false
          if [ "${built_at:0:10}" != "$(date -u +%F)" ]; then dates_due=true; fi
          echo "dates_due=$dates_due" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$live" ]; then
            echo "Live site matches the price file."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Price file changed since the last build."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger a production deploy
        if: (steps.check.outputs.changed == 'true' || steps.check.outputs.benchmarks_due == 'true' || steps.check.outputs.dates_due == 'true') && env.DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null

      - name: Wait for the new build to go live
        id: wait
        if: (steps.check.outputs.changed == 'true' || steps.check.outputs.benchmarks_due == 'true' || steps.check.outputs.dates_due == 'true') && env.DEPLOY_HOOK != ''
        run: |
          for _ in $(seq 1 40); do
            sleep 30
            built_at=$(curl -fsSL "$SITE/build-info.json" | jq -r '.builtAt // empty' || true)
            if [ -n "$built_at" ] && [ "$built_at" != "${{ steps.check.outputs.built_at }}" ]; then exit 0; fi
          done
          echo "The new build did not go live within 20 minutes."
          exit 1

      - name: Ping IndexNow with the pages that changed
        if: steps.check.outputs.changed == 'true' && env.DEPLOY_HOOK != ''
        # A failed ping must not skip the image health check below.
        continue-on-error: true
        run: |
          curl -fsSL "$SITE/changes.json" \
            | jq --arg key "$INDEXNOW_KEY" '{host: "models.litellm.ai", key: $key, keyLocation: ("https://models.litellm.ai/" + $key + ".txt"), urlList: .urls[0:10000]}' \
            > indexnow.json
          if [ "$(jq '.urlList | length' indexnow.json)" -eq 0 ]; then echo "No changed pages."; exit 0; fi
          submit_indexnow

      - name: Pre-warm share images for the pages that changed
        if: steps.check.outputs.changed == 'true' && env.DEPLOY_HOOK != ''
        # Loads each changed page's share image once, so the CDN has it cached
        # before anyone shares the link. Doubles as a health check for api/og.ts:
        # a few failures warn, all of them failing fails the run. Runs after the
        # IndexNow ping so a broken image endpoint never strands that ping: the
        # next run sees the deployed price hash and would not send it again.
        run: |
          curl -fsSL "$SITE/changes.json" | jq -r '(.images // [])[:200][]' > images.txt
          total=$(wc -l < images.txt | tr -d ' ')
          failed=0
          while read -r url; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            if [ "$code" != "200" ]; then
              echo "::warning::Share image returned HTTP $code: $url"
              failed=$((failed + 1))
            fi
          done < images.txt
          echo "Pre-warmed $((total - failed)) of $total share images."
          if [ "$total" -gt 0 ] && [ "$failed" -eq "$total" ]; then
            echo "::error::Every share image failed; check api/og.ts on the live site."
            exit 1
          fi

      - name: Submit every sitemap URL to IndexNow
        if: github.event_name == 'workflow_dispatch' && inputs.submit_all
        run: |
          for map in pages models providers; do
            curl -fsSL "$SITE/sitemaps/$map.xml" | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##'
          done > urls.txt
          jq -R -s --arg key "$INDEXNOW_KEY" '{host: "models.litellm.ai", key: $key, keyLocation: ("https://models.litellm.ai/" + $key + ".txt"), urlList: (split("\n") | map(select(length > 0)) | .[0:10000])}' urls.txt > indexnow.json
          submit_indexnow

  provider-logos:
    needs: refresh
    if: ${{ !cancelled() && (needs.refresh.outputs.deployed == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://models.litellm.ai
    steps:
      - name: Name the providers the live build shows with initials
        run: |
          build_info=$(curl -fsSL "$SITE/build-info.json")
          providers=$(jq -r '.unauditedProviders | if type == "array" then .[] else error("build-info.json has no unauditedProviders list") end' <<< "$build_info")
          if [ -z "$providers" ]; then
            echo "Every provider in the live build has an audited logo."
            exit 0
          fi
          echo "Providers that need an audited logo:" >> "$GITHUB_STEP_SUMMARY"
          while read -r provider; do
            echo "- $provider" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Provider logo needed::$provider has no entry in src/providerLogos.json, so models.litellm.ai shows its initials. Add its audited artwork as public/provider-logos/NOTICE.md describes."
          done <<< "$providers"
          exit 1
